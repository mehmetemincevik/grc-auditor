services:
  db:
    image: postgres:16
    container_name: grc-auditor-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - grc_auditor_pgdata:/var/lib/postgresql/data

volumes:
  grc_auditor_pgdata: